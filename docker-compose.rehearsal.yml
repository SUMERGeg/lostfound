name: lostfound-rehearsal

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rehearsal-root
      MYSQL_DATABASE: lostfound
      MYSQL_USER: rehearsal
      MYSQL_PASSWORD: rehearsal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prehearsal-root || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rehearsal_mysql_data:/var/lib/mysql

  server:
    build:
      context: ./server
      target: production
    environment:
      NODE_ENV: production
      PORT: 8080
      FRONT_ORIGIN: http://127.0.0.1:18080
      JWT_ACCESS_SECRET: rehearsal-access-secret-is-at-least-32-bytes-long
      EMAIL_TOKEN_SECRET: rehearsal-email-secret-is-different-and-32-bytes
      SECRETS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PRIVACY_EMAIL: privacy@lostfound.local
      PRIVACY_REQUEST_RATE_LIMIT_MAX: 5
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: rehearsal
      DB_PASSWORD: rehearsal
      DB_NAME: lostfound
      S3_BUCKET: lostfound-rehearsal
      S3_REGION: us-east-1
      S3_ENDPOINT: http://storage.invalid.local
      S3_PUBLIC_BASE_URL: http://storage.invalid.local/lostfound-rehearsal
      S3_ACCESS_KEY_ID: rehearsal
      S3_SECRET_ACCESS_KEY: rehearsal
      S3_FORCE_PATH_STYLE: "true"
      EMAIL_API_URL: http://email.invalid.local/send
      EMAIL_API_TOKEN: rehearsal
      EMAIL_FROM: LostFound Rehearsal <no-reply@lostfound.local>
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  client:
    build:
      context: ./client
      target: production
      args:
        VITE_YANDEX_MAPS_API_KEY: rehearsal-domain-restricted-key
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rehearsal_mysql_data:
