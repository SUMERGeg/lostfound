extends:
  - recommended

# Existing API operations predate the current documentation style rules.
# Keep schema/reference validation active while the style debt is resolved
# incrementally instead of hiding it in an auto-generated ignore file.
rules:
  operation-summary: off
  security-defined: off
  info-license: off
  no-server-example.com: off
  no-ambiguous-paths: off
  operation-4xx-response: off
