name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Test server
        working-directory: server
        run: npm test
      - name: Audit server runtime dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Audit client and build dependencies
        working-directory: client
        run: npm audit --audit-level=high
      - name: Lint client
        working-directory: client
        run: npm run lint
      - name: Test demo read-only behavior
        working-directory: client
        run: npm test
      - name: Build client
        working-directory: client
        env:
          VITE_YANDEX_MAPS_API_KEY: ci-placeholder-domain-restricted-key
        run: npm run build
      - name: Build Vercel demo
        working-directory: client
        run: npm run build:demo
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1 lint openapi.yaml
